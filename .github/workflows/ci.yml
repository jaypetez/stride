name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter (GOV-001): outputs which surfaces changed so expensive jobs run
  # only when needed. A plain git diff (no third-party action) keeps the supply
  # chain small. Pushes to main and manual runs treat everything as changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      cloud: ${{ steps.filter.outputs.cloud }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed surfaces
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-changes.mjs
  lint:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint & format check
        run: pnpm lint
      # Plain-Node tests for repo scripts (e.g. the Garmin probe's sanitizer).
      - name: Script tests
        run: pnpm test:scripts
      # contracts/science-golden is the parity contract for the Kotlin engine
      # port (ADR 0010); fail when packages/core changed without regenerating.
      - name: Science goldens up to date
        run: pnpm science:golden --check

  test:
    # Platform matrix: dev is Windows/Node 24, CI historically Ubuntu/Node 22.
    # The TypeScript 7 native compiler and esbuild are platform-specific binaries,
    # so exercise every combination to catch drift (AGENTS.md).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # typecheck & build drive platform-specific native binaries (the TS 7
      # native compiler, esbuild) that occasionally crash on the Windows runner
      # under load. Bounded retry rides out that transient flake; a real error
      # fails all attempts. (bash is available on all three runner OSes.)
      - name: Type check
        shell: bash
        run: for a in 1 2 3; do pnpm typecheck && exit 0; echo "::warning::typecheck attempt $a failed (native-tooling flake); retrying"; done; exit 1
      - name: Test
        run: pnpm test
      - name: Build
        shell: bash
        run: for a in 1 2 3; do pnpm build && exit 0; echo "::warning::build attempt $a failed (native-tooling flake); retrying"; done; exit 1
      - name: Verify (runtime smoke)
        run: pnpm verify

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Fails the job when any package drops below its `coverage.thresholds`
      # (per-package vitest configs; policy in docs/testing/coverage.md).
      - name: Coverage (enforces thresholds)
        run: pnpm coverage
      - name: Coverage summary
        if: always()
        shell: bash
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: "**/coverage/**"
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright (chromium)
        run: pnpm --filter @stride/web exec playwright install --with-deps chromium
      - name: Web e2e (Playwright)
        run: pnpm --filter @stride/web e2e

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies (fail on high+)
        # `pnpm audit` POSTs to npm's legacy audit endpoints, which npm has
        # retired (HTTP 410 → ERR_PNPM_AUDIT_BAD_RESPONSE). Treat that specific
        # infra failure as a soft warning so it can't wedge the required gate,
        # while still failing hard on genuine high+ advisories. Vulnerability
        # coverage is redundantly enforced by dependency-review + CodeQL.
        shell: bash
        run: |
          set +e
          out="$(pnpm audit --audit-level=high 2>&1)"
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ] && echo "$out" | grep -qE "ERR_PNPM_AUDIT_BAD_RESPONSE|being retired"; then
            echo "::warning::npm audit endpoint retired; advisory fetch skipped (covered by dependency-review + CodeQL)."
            exit 0
          fi
          exit "$code"

  # Android (ANDF-005): reusable workflow, run only when android/ or contracts/ change.
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android.yml
    permissions:
      contents: read

  # Secret scanning (SEC-005): the OSS gitleaks CLI, checksum-verified, over the PR's commits.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            gitleaks git --redact --verbose --config .gitleaks.toml --log-opts="${BASE_SHA}..${HEAD_SHA}" .
          else
            gitleaks git --redact --verbose --config .gitleaks.toml --log-opts="-n 50" .
          fi

  # Aggregate gate — this is the single required status check on `main`.
  # It passes only when every CI job above succeeds. Path-filtered jobs
  # (android) may be `skipped`; any failure or cancellation fails the gate.
  build:
    needs: [changes, lint, test, coverage, e2e, audit, android, gitleaks]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify all CI jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs
