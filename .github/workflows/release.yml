name: Release

on:
  push:
    branches: [main]

# Needed to open the "Version Packages" PR and to push tags / create releases.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create Version PR or tag a release
        # When changesets are pending, opens/updates a "Version Packages" PR.
        # When none are pending (versions just landed), tags the release and
        # creates GitHub Releases. Packages are private, so nothing publishes to npm.
        #
        # v2 renamed every input (version -> version-script, publish ->
        # publish-script, commit -> commit-message, title -> pr-title), dropped
        # the GITHUB_TOKEN env var in favour of the github-token input, and
        # requires Changesets CLI v3 -- so this pin moves in lockstep with
        # @changesets/cli.
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: pnpm run version
          publish-script: pnpm exec changeset git-tag
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
