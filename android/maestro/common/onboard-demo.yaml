# Shared subflow (AUD-039): fresh install → onboarding → "Try demo" → Today.
# Used by the flows in android/maestro/ through runFlow; it is in a subfolder so
# `maestro test android/maestro/` does not run it on its own.
appId: org.stride.app.debug
---
- clearState
- launchApp
# A previous flow may have left the device rotated; every flow starts in portrait.
- setOrientation: PORTRAIT
# Slow CI emulators sometimes show a system ANR dialog for the launcher.
- runFlow:
    when:
      visible: ".*isn't responding.*"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "Welcome to Stride"
    timeout: 20000
- runFlow:
    when:
      visible: ".*isn't responding.*"
    commands:
      - tapOn: "Wait"
- tapOn: "Get started"

# Profile ("About you"): name and birth year are required
- extendedWaitUntil:
    visible: "About you"
    timeout: 10000
- tapOn: "Name"
- inputText: "Maestro"
- tapOn: "Birth year"
- inputText: "1990"
- hideKeyboard
- tapOn: "Continue"

# PAR-Q ("Health check"): answer "No" to every question
- extendedWaitUntil:
    visible: "Health check"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "parq_no_0"
    centerElement: true
- tapOn:
    id: "parq_no_0"
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: "parq_no_1"
    centerElement: true
- tapOn:
    id: "parq_no_1"
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: "parq_no_2"
    centerElement: true
- tapOn:
    id: "parq_no_2"
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: "parq_no_3"
    centerElement: true
- tapOn:
    id: "parq_no_3"
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: "parq_no_4"
    centerElement: true
- tapOn:
    id: "parq_no_4"
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: "parq_no_5"
    centerElement: true
- tapOn:
    id: "parq_no_5"
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: "parq_no_6"
    centerElement: true
- tapOn:
    id: "parq_no_6"
    retryTapIfNoChange: true
- tapOn: "Continue"

# Disclaimer ("Before you start")
- extendedWaitUntil:
    visible: "Before you start"
    timeout: 10000
- scrollUntilVisible:
    element: "I have read and accept this"
- tapOn: "I have read and accept this"
- tapOn: "Continue"

# Finish: try the demo
- extendedWaitUntil:
    visible: "Try demo"
    timeout: 10000
- tapOn: "Try demo"

# Today (demo data goes through the real pipeline)
- extendedWaitUntil:
    visible: "Next workout"
    timeout: 60000
- assertVisible: "Exit demo"
